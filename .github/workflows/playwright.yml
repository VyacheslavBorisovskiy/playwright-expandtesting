name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  smoke:
    name: Smoke tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Install Playwright Browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps
      - name: Run smoke tests
        timeout-minutes: 15
        run: npx playwright test --grep @smoke
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_URL: ${{ vars.API_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        id: flaky
        run: node .github/scripts/flaky-report.js playwright-json/results.json smoke
        env:
          BASE_URL: ${{ vars.BASE_URL }}
      - name: Upload flaky test evidence
        if: ${{ !cancelled() && steps.flaky.outputs.has_flaky == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flaky-artifacts-smoke
          path: |
            test-results/
            flaky-report/
          retention-days: 30
      - name: Upload flaky summary data
        if: ${{ !cancelled() && steps.flaky.outputs.has_flaky == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report-smoke
          path: flaky-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          timeout-minutes: 5
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-smoke
          path: allure-results/
          retention-days: 30

  regression:
    name: Regression tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Install Playwright Browsers
        timeout-minutes: 5
        run: npx playwright install --with-deps
      - name: Run regression tests
        timeout-minutes: 45
        run: npx playwright test --grep @regression
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_URL: ${{ vars.API_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Report flaky tests
        if: ${{ !cancelled() }}
        id: flaky
        run: node .github/scripts/flaky-report.js playwright-json/results.json regression
        env:
          BASE_URL: ${{ vars.BASE_URL }}
      - name: Upload flaky test evidence
        if: ${{ !cancelled() && steps.flaky.outputs.has_flaky == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flaky-artifacts-regression
          path: |
            test-results/
            flaky-report/
          retention-days: 30
      - name: Upload flaky summary data
        if: ${{ !cancelled() && steps.flaky.outputs.has_flaky == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flaky-report-regression
          path: flaky-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-regression
          timeout-minutes: 5
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-regression
          path: allure-results/
          retention-days: 30

    allure-report:
      name: Publish Allure report
      needs: [smoke, regression]
      if: ${{ !cancelled() }}
      runs-on: ubuntu-latest
      timeout-minutes: 15

      permissions:
      contents: write

      concurrency:
      group: allure-report-deployment
      cancel-in-progress: false

      steps:
        - uses: actions/checkout@v4

        - name: Download smoke Allure results
          uses: actions/download-artifact@v4
          continue-on-error: true
          with:
            name: allure-results-smoke
            path: allure-results

        - name: Download regression Allure results
          uses: actions/download-artifact@v4
          continue-on-error: true
          with:
            name: allure-results-regression
            path: allure-results

        - name: Verify Allure results
          run: |
            mkdir -p allure-results
            echo "Allure result file count:"
            find allure-results -maxdepth 1 -type f | wc -l
            echo "Result file samples:"
            find allure-results -maxdepth 1 -type f | head -20

        - name: Get previous Allure history
          uses: actions/checkout@v4
          if: always()
          continue-on-error: true
          with:
            ref: gh-pages
            path: gh-pages

        - name: Generate Allure report with history
          uses: step-security/allure-report-action@v1
          if: always()
          with:
            allure_results: allure-results
            gh_pages: gh-pages
            allure_report: allure-report
            allure_history: allure-history
            keep_reports: 30

        - name: Verify generated history
          run: |
            echo "Generated history files:"
            find allure-report/history -maxdepth 1 -type f 2>/dev/null || true
            echo "Published report files:"
            find allure-history -maxdepth 2 -type f | head -30

        - name: Deploy Allure report
          if: always() && github.event_name == 'push'
          uses: peaceiris/actions-gh-pages@v4
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_branch: gh-pages
            publish_dir: allure-history

        - name: Print report URL
          if: always()
          run: |
            echo "### Allure report" >> "$GITHUB_STEP_SUMMARY"
            echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
